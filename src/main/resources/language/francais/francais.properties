#Algorithmes
algorithm.bestPossibleLineup.description=Remplit d'abord le pont avec les équipes les plus fortes disponibles, puis couvre toutes les autres forteresses en largeur d'abord – chaque forteresse reçoit une équipe avant qu'aucune n'en reçoive une deuxième. Une forteresse buffée reçoit l'équipe qui correspond le mieux à son buff ; une forteresse non buffée reçoit délibérément l'équipe la plus faible disponible, afin que les équipes les plus fortes restent disponibles pour le pont et les forteresses buffées. Ne modifie jamais une attribution déjà existante.
algorithm.balancedDefense.description=Même approche que « Best possible lineup » pour le pont, mais au lieu de suivre un ordre fixe, renforce à chaque fois la forteresse actuellement la plus faible (CowScore par place) – l'objectif est une carte défendue de manière homogène plutôt que quelques points forts très renforcés.
algorithm.cowScoreMaximizer.description=Utilise une seule mesure cohérente – CowScore plus puissance – pour chaque décision, pont y compris, et choisit toujours l'équipe qui la maximise. Contrairement aux autres stratégies, elle ne réserve pas délibérément les équipes fortes au pont ou aux forteresses buffées : une forteresse non buffée reçoit elle aussi l'équipe la plus forte disponible.
algorithm.consensusPicks.description=Une méta-stratégie plutôt qu'une stratégie à part entière : elle exécute les trois autres algorithmes indépendamment sur le même lineup et n'attribue une équipe que si les trois sont d'accord sur la même forteresse. Chaque désaccord reste volontairement sans attribution – ces lacunes indiquent précisément les endroits où les stratégies divergent et où ton propre jugement est nécessaire.
algorithm.manual.description=Aucune attribution automatique pour ce côté : ses forteresses restent telles quelles et sont occupées à la main.

