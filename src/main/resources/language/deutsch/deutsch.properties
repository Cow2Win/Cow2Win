# Algorithmen
algorithm.bestPossibleLineup.description=Füllt zuerst die Brücke mit den stärksten verfügbaren Teams, deckt danach reihum jede andere Festung ab – jede Festung bekommt ein Team, bevor irgendeine ein zweites bekommt. Eine gebuffte Festung bekommt das Team mit dem besten Buff-Fit; eine ungebuffte Festung bekommt bewusst das schwächste verfügbare Team, damit die stärksten Teams für die Brücke und gebuffte Festungen übrig bleiben. Eine bereits vorhandene Zuweisung wird nie verändert.
algorithm.balancedDefense.description=Gleiches Vorgehen wie „Best possible lineup“ bei der Brücke, aber statt einer festen Reihenfolge wird immer wieder die aktuell schwächste Festung (gemessen am CowScore) verstärkt – Ziel ist eine gleichmäßig verteidigte Karte statt weniger stark verstärkter Knotenpunkte.
algorithm.cowScoreMaximizer.description=Verwendet für jede Entscheidung – auch die Brücke – ein einziges, einheitliches Maß: CowScore plus Power, und wählt dabei immer das Team mit dem höchsten Wert. Anders als die anderen Strategien werden starke Teams nicht bewusst für die Brücke oder gebuffte Festungen geschont: auch eine ungebuffte Festung bekommt das stärkste verfügbare Team.
algorithm.consensusPicks.description=Eine Meta-Strategie statt einer eigenen: lässt die drei anderen Algorithmen unabhängig voneinander auf demselben Lineup laufen und weist ein Team nur zu, wenn sich alle drei einig sind, welche Festung es bekommen soll. Jede Uneinigkeit bleibt bewusst offen – genau diese Lücken markieren die Stellen, an denen die Strategien unterschiedlicher Meinung sind und Deine eigene Einschätzung gefragt ist.

