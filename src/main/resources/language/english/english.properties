#Algorithms
algorithm.bestPossibleLineup.description=Fills the bridge first with the strongest available teams, then covers every other fortification breadth-first - each fortification gets one team before any of them gets a second. A buffed fortification gets whichever available team fits its buff best; an unbuffed fortification deliberately gets the weakest available team instead, so the strongest teams stay available for the bridge and for buffed fortifications. Never touches an assignment that is already there.
algorithm.balancedDefense.description=Same bridge-first approach as "Best possible lineup", but instead of following a fixed fortification order, it repeatedly reinforces whichever fortification is currently weakest (measured by CowScore) - aiming for an evenly defended map instead of a few heavily stacked strongpoints.
algorithm.cowScoreMaximizer.description=Uses one single, consistent measure - CowScore plus power - for every decision it makes, the bridge included, and always picks the team that maximizes it. Unlike the other strategies, it does not deliberately save strong teams for the bridge or for buffed fortifications: an unbuffed fortification gets the strongest available team too.
algorithm.consensusPicks.description=A meta-strategy rather than a strategy of its own: it runs the other three algorithms independently on the same lineup and only actually assigns a team where all three agree on the same fortification for it. Every disagreement is left open on purpose - those gaps mark exactly the spots where the strategies see it differently and your own judgment is needed.

