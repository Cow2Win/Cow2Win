# Filled in at build time by Maven resource filtering (see pom.xml's
# <resources> section) from the "app.version" property - the same one
# jpackage uses as the packaged app's version. Read via org.c2w.util.AppVersion.
# If this still shows the literal "${app.version}" placeholder, resource
# filtering did not run (e.g. resources were compiled some other way than
# through Maven's process-resources phase) - AppVersion falls back to a safe
# "unknown" value in that case rather than using it as-is.
version=${app.version}
