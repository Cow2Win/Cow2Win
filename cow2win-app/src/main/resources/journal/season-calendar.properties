# Weltenschlacht season calendar (read by org.c2w.data.journal.SeasonCalendar).
#
# One line per season: <season number>=<first day, ISO yyyy-MM-dd>.
# Rule of the game: a season lasts 12 weeks (Monday to Sunday), followed by a
# 1-week break, so normally a new season starts every 13 weeks. After the last
# line the calendar continues in this 13-week cycle; before the first line there
# is no season. Exceptions (e.g. a 2-week break, server merges) are the same for
# all guilds.
#
# Source: round plans on h-w.fun; seasons 16 and 17 confirmed by the user (10.10.2026).
#
# When the game deviates from the cycle, add the real start of the affected
# season (and nothing else) here with the next release. Numbers must be gapless,
# every start must be a Monday and at least 12 weeks after the previous one.
4=2023-07-10
