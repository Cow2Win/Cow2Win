journal.teams.rules=Cow2Win reads the defense logs of the imported battles. For each member its newest battle with known heroes or titans counts; teams from older battles are offered as well but not preselected.\nHeroes or titans are known if the defense log contains them or an attack team of the same player in the same battle has exactly the same power. Teams of which only the power is known are not offered.\nTeams with heroes/titans are never changed; only missing teams are created and empty teams filled. "Apply and save" saves the guild.
