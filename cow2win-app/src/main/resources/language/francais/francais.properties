journal.teams.rules=Cow2Win lit les journaux de défense des combats importés. Pour chaque membre, son combat le plus récent avec des héros ou titans connus compte ; les équipes de combats plus anciens sont aussi proposées, mais pas présélectionnées.\nLes héros ou titans sont connus si le journal de défense les contient ou si une équipe d’attaque du même joueur dans le même combat a exactement la même puissance. Les équipes dont seule la puissance est connue ne sont pas proposées.\nLes équipes avec héros/titans ne sont jamais modifiées ; seules les équipes manquantes sont créées et les équipes vides remplies. « Appliquer et enregistrer » enregistre la guilde.
