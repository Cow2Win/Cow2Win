#Algorithms
algorithm.hodor.description=Hold the door: protege primero las puertas (el Puente, los tres bastiones, de los que solo cuenta el más débil, el Puente de los Héroes y los templos), ponderadas según los puntos que hay detrás; después, las bonificaciones de captura y, por último, cada puesto. Calcula con el poder y la bonificación real de la fortificación, que cuenta las unidades adecuadas de toda la fortificación. Toma los equipos más fuertes más algunos equipos de reserva y los intercambia hasta que la alineación ya no mejore.
algorithm.hodorCowScore.description=Como HODOR, pero valora cada equipo por su CowScore en lugar de por el poder y la bonificación real.
algorithm.shield.description=Defensa avanzada: el Puente recibe los equipos más fuertes; después, cada fortificación hasta las puertas de titanes (los tres bastiones); después, la fila central, con prioridad para el Puente de los Héroes. Todo lo que está detrás del Puente de los Héroes, incluidos los templos y la Ciudadela, recibe los equipos más débiles. Los equipos nunca cambian de fila; dentro de una fila se colocan como en HODOR (bonificación real, unidades adecuadas de toda la fortificación, cuenta el más débil de los tres bastiones). Los equipos más débiles se quedan fuera; no hay reserva.
algorithm.manual.description=Sin asignación automática para este tipo: sus fortificaciones se quedan exactamente como están, para rellenarlas a mano.
algorithm.hodor.summary=Protege primero las puertas, con el poder y la bonificación real.
algorithm.hodorCowScore.summary=Como HODOR, pero con el CowScore en lugar de la bonificación real.
algorithm.shield.summary=Defensa avanzada: los equipos más fuertes delante, los más débiles tras el Puente de los Héroes.
algorithm.maxBuff.description=Rellena primero las fortificaciones con bonificación para que el mayor número posible de unidades coincida con su bonificación (rol o elemento), sin importar lo fuertes que sean los equipos; todas las fortificaciones con bonificación cuentan igual. Los equipos con unidades mixtas van donde más aportan; solo en caso de empate gana el equipo más fuerte. Después, el Puente y el Puente de los Héroes reciben los equipos más fuertes que quedan y, a continuación, cada uno de los demás puestos según la bonificación de captura, empezando por el equipo más fuerte. Usa la reserva como HODOR.
algorithm.maxBuff.summary=Saca la mayor bonificación posible de los equipos; la fuerza solo cuenta después.

